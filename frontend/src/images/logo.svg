<svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LinkUp">
  <!-- blue rounded square background, similar feel to LinkedIn "in" -->
  <rect x="0" y="0" width="28" height="28" rx="4" fill="#0A66C2" />

  <!-- "up" letters in white, vertically aligned like LinkedIn "in" -->
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- "u" -->
    <text x="9" y="19" font-size="13" font-weight="700">u</text>
    <!-- "p" -->
    <text x="16" y="19" font-size="13" font-weight="700">p</text>
  </g>
</svg>