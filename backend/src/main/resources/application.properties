spring.application.name=linkup-backend
#
# Default (no explicit profile): MySQL config via environment variables.
# If you don't have MySQL running locally, start the app with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/linkup}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Fixed secret so JWT tokens stay valid across server restarts (min 32 chars for HS256)
jwt.secret=LinkUpBackendSecretKeyForJWTTokenSigning2024Minimum32Characters

# Allow larger files for images/videos (50MB per file, 100MB total request)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB