spring.application.name=linkup-backend
spring.datasource.url=jdbc:mysql://localhost:3306/linkup
spring.datasource.username=root
spring.datasource.password=123@#@#@#

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Fixed secret so JWT tokens stay valid across server restarts (min 32 chars for HS256)
jwt.secret=LinkUpBackendSecretKeyForJWTTokenSigning2024Minimum32Characters

# Allow larger files for images/videos (50MB per file, 100MB total request)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB